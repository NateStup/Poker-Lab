services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pokerlab
      POSTGRES_PASSWORD: pokerlab_dev
      POSTGRES_DB: pokerlab
    ports:
      - "5432:5432"
    volumes:
      - pokerlab_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokerlab"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pokerlab_pg_data:
