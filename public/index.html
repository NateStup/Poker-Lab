<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Poker Lab</title>
    <meta
      name="description"
      content="A Texas Hold'em poker toolkit: an equity calculator with exact enumeration and seeded Monte Carlo simulation, and a range explorer for range-vs-hand and range-vs-range equity."
    />
    <link rel="stylesheet" href="/stylesheets/style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%E2%99%A0%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>

    <!--
      React is loaded as a UMD global rather than bundled, which keeps the
      project buildless: `main.js` and the shared domain modules are served
      straight to the browser as native ES modules. Swap to the production
      builds (react.production.min.js) before deploying.
    -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script type="module" src="/javascripts/poker/main.js"></script>
  </body>
</html>
